# Robolectric 运行配置
#
# ⚠️ dependency.repo.url 是必须的（2026-10-04 血泪）：
#   Robolectric 运行时会自己去下载 android-all-instrumented*.jar（~130MB），
#   它**不走 Gradle 的依赖解析**，而是用自己的 MavenDependencyResolver 直连默认的
#   repo1.maven.org —— 而本环境 repo1.maven.org / repo.maven.apache.org 恒返 **429**
#   ⇒ 测试会卡在下载 android-all 上，看起来又是"gradle 卡死"。
#   这里显式换成可用的国内镜像，才能让 Robolectric 拉得到 SDK jar。
robolectric.dependency.repo.url=https://mirrors.tencent.com/nexus/repository/maven-public/
robolectric.dependency.repo.id=tencent

# 固定 SDK 级别：compileSdk 是 36，但 Robolectric 只要能解析到某个 android-all jar 即可，
# 写死 35 避免"SDK 36 的 android-all 尚未发布/镜像缺包"的解析失败。
sdk=35

# 用最朴素的 Application，不加载项目自己的 Application（避免 Bugly / 加密目录等初始化副作用）
# （@Config(application=...) 也可逐类覆盖）
robolectric.application=android.app.Application
