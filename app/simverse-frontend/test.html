<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>SimVerse 简单测试</title>
  <style>
    body { font-family: sans-serif; padding: 40px; background: #f0f0f0; }
    .box { background: #fff; padding: 30px; border-radius: 8px; max-width: 500px; margin: 0 auto; }
    h1 { color: #333; }
    .ok { color: green; }
    .fail { color: red; }
    pre { background: #eee; padding: 10px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>SimVerse 测试</h1>
    <p id="status">⏳ 加载中...</p>
    <div id="detail"></div>
  </div>

  <script type="module">
    // 直接执行，不依赖任何框架
    const log = (msg, isError = false) => {
      const detail = document.getElementById('detail');
      const span = document.createElement(isError ? 'p' : 'p');
      span.className = isError ? 'fail' : 'ok';
      span.textContent = (isError ? '❌ ' : '✅ ') + msg;
      detail.appendChild(span);
      console.log(msg);
    };

    // 测试基本 DOM 操作
    try {
      document.getElementById('status').textContent = '✅ DOM 可用';
      
      // 测试动态导入
      log('测试动态导入 @self/views/SimverseHome.vue...');
      import('@self/views/SimverseHome.vue')
        .then(mod => {
          log('动态导入成功!', false);
          log('组件: ' + Object.keys(mod).join(', '));
          
          // 测试 Vue 导入
          log('测试 Vue...');
          import('vue').then(v => {
            log('Vue 版本: ' + v.version);
            
            // 测试 Ionic
            log('测试 Ionic...');
            import('@ionic/vue').then(ionic => {
              log('IonicVue 导入成功');
              
              // 全部成功
              document.getElementById('status').textContent = '🎉 全部成功!';
              document.getElementById('status').style.color = 'green';
              document.getElementById('status').style.fontSize = '24px';
            }).catch(e => {
              log('Ionic 失败: ' + e.message, true);
            });
          }).catch(e => {
            log('Vue 失败: ' + e.message, true);
          });
        })
        .catch(e => {
          log('动态导入失败: ' + e.message, true);
          log('错误: ' + e.stack, true);
        });
    } catch (e) {
      log('初始化失败: ' + e.message, true);
    }

    // 10秒超时
    setTimeout(() => {
      const detail = document.getElementById('detail');
      if (detail.children.length === 0 || !document.getElementById('status').textContent.includes('成功')) {
        log('⚠️ 超时 - 请检查网络/控制台', true);
      }
    }, 10000);
  </script>
</body>
</html>
