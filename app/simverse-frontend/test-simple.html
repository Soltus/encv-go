<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SimVerse</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; background: #fff; }
    .header { background: #333; color: #fff; padding: 10px; display: flex; gap: 10px; }
    .header button { padding: 8px 16px; background: #555; color: #fff; border: none; cursor: pointer; }
    .content { padding: 20px; }
    .card { background: #f0f0f0; padding: 15px; margin: 10px 0; border-radius: 8px; }
    h1 { color: #333; }
    p { color: #666; }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <button @click="page = 'home'">首页</button>
      <button @click="page = 'settings'">设置</button>
      <button @click="page = 'devlogs'">日志</button>
    </div>
    <div class="content">
      <div v-if="page === 'home'">
        <h1>🏠 SimVerse 模拟世界</h1>
        <div class="card">
          <p>Tick: {{ tick }}</p>
          <p>NPC 数: {{ npc }}</p>
          <p>时代: {{ Math.floor(tick / 1000) }}</p>
        </div>
        <button @click="tick++">+ Tick</button>
        <button @click="npc++">+ NPC</button>
      </div>
      <div v-if="page === 'settings'">
        <h1>⚙️ 设置</h1>
        <p>性能等级: 中</p>
        <p>（暂未连接后端）</p>
      </div>
      <div v-if="page === 'devlogs'">
        <h1>📋 开发日志</h1>
        <p>暂无日志</p>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;
    createApp({
      setup() {
        const page = ref('home');
        const tick = ref(123456789);
        const npc = ref(42);
        return { page, tick, npc };
      }
    }).mount('#app');
  </script>
</body>
</html>
