      - type: text_delta
        data: { text: "5. 跳过\n" }
  - id: summary_9
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "6. 重新跑 ffprobe（不同参数）\n" }
  - id: summary_10
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "选择你想做的，剩下交给我。" }

  # 阶段 6：chip + 收尾
  - id: push_chips
    round_idx: 0
    delay_ms: 200
    events:
      - type: mock_presets
        data:
          scenario: command_run_ffprobe
          phase: after_ffprobe
          presets:
            - id: show_metadata
              label: "📊 看完整元数据"
              user_text: "看完整元数据"
            - id: extract_thumbnail
              label: "🖼️ 抽缩略图"
              user_text: "抽缩略图"
            - id: cancel
              label: "❌ 取消"
              user_text: "取消"
  - id: end
    round_idx: 0
    delay_ms: 200
    events:
      - type: stream_end
        data:
          finishReason: stop
          usage: { totalTokens: 1560 }
