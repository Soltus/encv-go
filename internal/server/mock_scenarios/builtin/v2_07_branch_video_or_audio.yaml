id: branch_video_or_audio
description: "分支选择：视频 vs 音频 vs 其他 — 父剧本 30s + 3 个 onMatch 子剧本各 30s，纯通用 UI 文案"
keywords:
  - "branch_video_or_audio"
  - "视频还是音频"
  - "选视频"
  - "选音频"
exact_match: "branch_video_or_audio"
rounds: 1

# ════════════════════════════════════════════════════════
# 分支：video（跑 ffprobe 抽视频流）/ audio（跑 ffprobe 抽音频流）/ other（读元数据）
# ════════════════════════════════════════════════════════
branches:
  - id: video
    label: "🎬 视频"
    icon: "🎬"
    description: "查看视频流元数据"
    on_match:
      id: video_subscenario
      description: "视频子剧本（父选「视频」后跳转）— 拟人化 ≥30s"
      keywords: []
      rounds: 0
      steps:
        - id: v_think_1
          delay_ms: 700
          events:
            - type: reasoning_delta
              data: { text: "用户选了「视频」。" }
        - id: v_think_2
          delay_ms: 700
          events:
            - type: reasoning_delta
              data: { text: "需要跑 ffprobe 提取视频流元数据。" }
        - id: v_think_3
          delay_ms: 800
          events:
            - type: reasoning_delta
              data: { text: "参数：select_streams=v:0（只取第一个视频流）。" }
        - id: v_think_4
          delay_ms: 800
          events:
            - type: reasoning_delta
              data: { text: "用 show_entries=stream=codec_name,width,height,duration。" }
        - id: v_think_5
          delay_ms: 800
          events:
            - type: reasoning_delta
              data: { text: "auto_run=false，但 ffprobe 是只读，可直接执行。" }
        - id: v_think_6
          delay_ms: 800
          events:
            - type: reasoning_delta
              data: { text: "准备好调用工具。" }
        - id: v_intro_1
          delay_ms: 400
          events:
            - type: stream_start
              data: { scenario: video_subscenario }
            - type: text_delta
              data: { text: "好的，进入视频流分析。" }
        - id: v_intro_2
          delay_ms: 600
          events:
            - type: text_delta
              data: { text: "目标：提取视频流元数据。" }
        - id: v_intro_3
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "用 ffprobe + show_entries 提取关键字段。" }
        - id: v_intro_4
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "只取第一个视频流。" }
        - id: v_intro_5
          delay_ms: 800
          events:
            - type: text_delta
              data: { text: "开始执行..." }
        - id: v_tool
          delay_ms: 3000
          events:
            - type: tool_call
              data:
                id: call_vid_1
                name: command_run
                args:
                  cmd: "ffprobe"
                  args: ["-v", "quiet", "-print_format", "json", "-show_streams", "-select_streams", "v:0"]
                  stdin_file: ""
                  timeout_ms: 30000
                auto_run: true
                needsConfirm: false
                kind: commandRun
                execute_real: true
        - id: v_p_1
          delay_ms: 600
          events:
            - type: text_delta
              data: { text: "ffprobe 执行完成。" }
        - id: v_p_2
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "正在解析视频流..." }
        - id: v_p_3
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "工具返回了元数据，详情见上方工具结果。" }
        - id: v_p_4
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "正在提取分辨率..." }
        - id: v_p_5
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "正在提取帧率..." }
        - id: v_p_6
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "正在提取编解码..." }
        - id: v_p_7
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "正在提取时长..." }
        - id: v_p_8
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "正在提取码率..." }
        - id: v_p_9
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "完整视频流元数据见工具结果。" }
        - id: v_p_10
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "正在准备下一步建议..." }
        - id: v_p_11
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "建议：抽缩略图、抽关键帧、转码、提取字幕。" }
        - id: v_p_12
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "选择你想做的，剩下交给我。" }
        - id: v_s_1
          delay_ms: 500
          events:
            - type: text_delta
              data: { text: "## 视频流分析完成\n\n" }
        - id: v_s_2
          delay_ms: 600
          events:
            - type: text_delta
              data: { text: "已提取完整元数据，详情见上方工具结果。\n\n" }
        - id: v_s_3
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "选择你想做的，剩下交给我。" }
        - id: v_end
          delay_ms: 200
          events:
            - type: stream_end
              data: { finishReason: stop, usage: { totalTokens: 960 } }

