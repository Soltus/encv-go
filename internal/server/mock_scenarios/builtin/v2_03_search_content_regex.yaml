id: search_content_regex
description: "内容正则搜索（按文件内容匹配）— 拟人化 ≥30s，纯通用 UI 文案"
keywords:
  - "search_content_regex"
  - "内容搜索"
  - "正则搜索"
  - "grep"
exact_match: "search_content_regex"
rounds: 1

presets:
  - id: show_matches
    label: "📁 展示命中"
    user_text: "展示搜索结果"
  - id: refilter
    label: "🔧 改正则"
    user_text: "用其他正则再搜"
  - id: edit_metadata
    label: "✏️ 编辑元数据"
    user_text: "查看元数据"

steps:
  # 阶段 1：思考链（8 段 × 700-800ms ≈ 6000ms）
  - id: think_1
    round_idx: 0
    delay_ms: 700
    events:
      - type: reasoning_delta
        data: { text: "用户要求：按文件内容搜索文件。" }
  - id: think_2
    round_idx: 0
    delay_ms: 700
    events:
      - type: reasoning_delta
        data: { text: "需要调用支持正则的内容搜索工具。" }
  - id: think_3
    round_idx: 0
    delay_ms: 800
    events:
      - type: reasoning_delta
        data: { text: "参数设计：regex 模式 + ext 过滤。" }
  - id: think_4
    round_idx: 0
    delay_ms: 800
    events:
      - type: reasoning_delta
        data: { text: "递归扫描所有挂载点，加 result 限额防爆。" }
  - id: think_5
    round_idx: 0
    delay_ms: 800
    events:
      - type: reasoning_delta
        data: { text: "auto_run 直接执行，不需要用户确认。" }
  - id: think_6
    round_idx: 0
    delay_ms: 800
    events:
      - type: reasoning_delta
        data: { text: "准备好调用工具。" }
  - id: think_7
    round_idx: 0
    delay_ms: 800
    events:
      - type: reasoning_delta
        data: { text: "正则需要转义，工具会自动处理。" }
  - id: think_8
    round_idx: 0
    delay_ms: 800
    events:
      - type: reasoning_delta
        data: { text: "准备开始执行。" }

  # 阶段 2：过渡文本（6 段 × 500-700ms ≈ 3700ms）
  - id: intro_1
    round_idx: 0
    delay_ms: 400
    events:
      - type: stream_start
        data: { scenario: search_content_regex }
      - type: text_delta
        data: { text: "好的，我来处理。" }
  - id: intro_2
    round_idx: 0
    delay_ms: 500
    events:
      - type: text_delta
        data: { text: "目标：按内容搜索文件。" }
  - id: intro_3
    round_idx: 0
    delay_ms: 600
    events:
      - type: text_delta
        data: { text: "用正则匹配文件内容。" }
  - id: intro_4
    round_idx: 0
    delay_ms: 600
    events:
      - type: text_delta
        data: { text: "需要遍历文件内容，可能比较慢。" }
  - id: intro_5
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "挂载点比较多。" }
  - id: intro_6
    round_idx: 0
    delay_ms: 800
    events:
      - type: text_delta
        data: { text: "开始调用工具..." }

  # 阶段 3：工具调用（3000ms）
  - id: tool_call
    round_idx: 0
    delay_ms: 3000
    events:
      - type: tool_call
        data:
          id: call_scr_1
          name: search_content
          args:
            regex: "TODO|FIXME|XXX"
            file_glob: "*.{txt,md,go,js,ts,py}"
            recursive: true
            max_results: 50
          auto_run: true
          needsConfirm: false
          kind: fileSearch
          execute_real: true

  # 阶段 4：处理结果（14 段 × 600-700ms ≈ 9500ms）
  - id: process_1
    round_idx: 0
    delay_ms: 600
    events:
      - type: text_delta
        data: { text: "搜索完成。" }
  - id: process_2
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "让我解析匹配结果..." }
  - id: process_3
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "工具返回了若干匹配项，详情见上方工具结果。" }
  - id: process_4
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "正在按文件分组..." }
  - id: process_5
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "正在按匹配类型分类..." }
  - id: process_6
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "正在统计每个文件的匹配数..." }
  - id: process_7
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "正在识别高匹配密度文件..." }
  - id: process_8
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "正在标记潜在需关注项..." }
  - id: process_9
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "完整路径和行号见工具返回结果。" }
  - id: process_10
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "正在准备下一步建议..." }
  - id: process_11
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "正在分析是否有需要立即处理的内容..." }
  - id: process_12
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "根据命中情况，建议如下：" }
  - id: process_13
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "选择你想做的，剩下交给我。" }
  - id: process_14
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "如果都不想做，可以直接忽略。" }

  # 阶段 5：总结建议（10 段 × 500-700ms ≈ 6000ms）
  - id: summary_1
    round_idx: 0
    delay_ms: 500
    events:
      - type: text_delta
        data: { text: "## 内容搜索结果总结\n\n" }
  - id: summary_2
    round_idx: 0
    delay_ms: 600
    events:
      - type: text_delta
        data: { text: "命中若干匹配项，详细路径见上方工具结果。\n\n" }
  - id: summary_3
    round_idx: 0
    delay_ms: 600
    events:
      - type: text_delta
        data: { text: "**建议**（点击 chip 直接执行）：\n\n" }
  - id: summary_4
    round_idx: 0
    delay_ms: 600
    events:
      - type: text_delta
        data: { text: "1. 展示完整命中\n" }
  - id: summary_5
    round_idx: 0
    delay_ms: 600
    events:
      - type: text_delta
        data: { text: "2. 用其他正则再搜\n" }
  - id: summary_6
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "3. 对文件做元数据编辑\n" }
  - id: summary_7
    round_idx: 0
    delay_ms: 600
    events:
      - type: text_delta
        data: { text: "4. 用更严格条件过滤\n" }
  - id: summary_8
    round_idx: 0
    delay_ms: 600
    events:
      - type: text_delta
        data: { text: "5. 跳过，保留现状\n" }
  - id: summary_9
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "6. 立即批量处理\n" }
  - id: summary_10
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "选择你想做的，剩下交给我。" }

  # 阶段 6：chip + 收尾
  - id: push_chips
    round_idx: 0
    delay_ms: 200
    events:
      - type: mock_presets
        data:
          scenario: search_content_regex
          phase: after_search
          presets:
            - id: show_matches
              label: "📁 展示命中"
              user_text: "展示搜索结果"
            - id: refilter
              label: "🔧 改正则"
              user_text: "用其他正则再搜"
            - id: edit_metadata
              label: "✏️ 编辑元数据"
              user_text: "查看元数据"
  - id: end
    round_idx: 0
    delay_ms: 200
    events:
      - type: stream_end
        data:
          finishReason: stop
          usage: { totalTokens: 1420 }
