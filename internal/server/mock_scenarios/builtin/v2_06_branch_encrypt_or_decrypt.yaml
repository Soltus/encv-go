id: branch_encrypt_or_decrypt
description: "分支选择：加密 vs 解密 — 父剧本 30s + 2 个 onMatch 子剧本各 30s，纯通用 UI 文案"
keywords:
  - "branch_encrypt_or_decrypt"
  - "加密还是解密"
  - "选加密"
  - "选解密"
exact_match: "branch_encrypt_or_decrypt"
rounds: 1

# ════════════════════════════════════════════════════════
# 分支：encrypt（加密子剧本）/ decrypt（解密子剧本）/ cancel
# 每个 on_match 是独立子剧本，dump 测试不会跑（只跑父剧本）
# 真实 UI 选择 chip 后才会跳进 on_match
# ════════════════════════════════════════════════════════
branches:
  - id: encrypt
    label: "🔒 加密"
    icon: "🔒"
    description: "加密文件"
    trigger_keywords:
      - "加密"
      - "encrypt"
      - "lock"
    on_match:
      id: encrypt_subscenario
      description: "加密子剧本（父选「加密」后跳转）— 拟人化 ≥30s"
      keywords: []
      rounds: 0
      steps:
        # 思考 6 段
        - id: e_think_1
          delay_ms: 700
          events:
            - type: reasoning_delta
              data: { text: "用户选了「加密」。" }
        - id: e_think_2
          delay_ms: 700
          events:
            - type: reasoning_delta
              data: { text: "需要调用加密工具。" }
        - id: e_think_3
          delay_ms: 800
          events:
            - type: reasoning_delta
              data: { text: "参数：input_file + output_file + password。" }
        - id: e_think_4
          delay_ms: 800
          events:
            - type: reasoning_delta
              data: { text: "使用 AES-256-GCM 算法。" }
        - id: e_think_5
          delay_ms: 800
          events:
            - type: reasoning_delta
              data: { text: "auto_run=false，加密是写操作，必须用户确认。" }
        - id: e_think_6
          delay_ms: 800
          events:
            - type: reasoning_delta
              data: { text: "准备好调用加密工具。" }
        # 过渡 5 段
        - id: e_intro_1
          delay_ms: 400
          events:
            - type: stream_start
              data: { scenario: encrypt_subscenario }
            - type: text_delta
              data: { text: "好的，进入加密流程。" }
        - id: e_intro_2
          delay_ms: 600
          events:
            - type: text_delta
              data: { text: "目标：加密选中的文件。" }
        - id: e_intro_3
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "用 AES-256-GCM 算法。" }
        - id: e_intro_4
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "需要密码，加密后密码需妥善保管。" }
        - id: e_intro_5
          delay_ms: 800
          events:
            - type: text_delta
              data: { text: "开始执行加密..." }
        # 工具调用
        - id: e_tool
          delay_ms: 3000
          events:
            - type: tool_call
              data:
                id: call_enc_1
                name: encrypt_file
                args:
                  ext: ".mp4"
                  password: ""
                auto_run: false
                needsConfirm: true
                kind: fileChange
                execute_real: true
        # 处理 12 段
        - id: e_p_1
          delay_ms: 600
          events:
            - type: text_delta
              data: { text: "加密完成。" }
        - id: e_p_2
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "正在校验输出文件..." }
        - id: e_p_3
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "工具返回了加密结果，详情见上方工具结果。" }
        - id: e_p_4
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "加密文件路径和大小见工具结果。" }
        - id: e_p_5
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "正在计算加密率..." }
        - id: e_p_6
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "正在校验完整性..." }
        - id: e_p_7
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "所有校验通过。" }
        - id: e_p_8
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "正在准备下一步建议..." }
        - id: e_p_9
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "建议操作：" }
        - id: e_p_10
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "1. 立即解密验证" }
        - id: e_p_11
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "2. 加密更多文件" }
        - id: e_p_12
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "3. 删除原文件（加密后）" }
        # 总结 5 段
        - id: e_s_1
          delay_ms: 500
          events:
            - type: text_delta
              data: { text: "## 加密完成\n\n" }
        - id: e_s_2
          delay_ms: 600
          events:
            - type: text_delta
              data: { text: "已加密指定文件，详情见上方工具结果。\n\n" }
        - id: e_s_3
          delay_ms: 600
          events:
            - type: text_delta
              data: { text: "**重要**：请妥善保管密码，丢失将无法解密。\n\n" }
        - id: e_s_4
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "选择你想做的，剩下交给我。" }
        - id: e_end
          delay_ms: 200
          events:
            - type: stream_end
              data: { finishReason: stop, usage: { totalTokens: 980 } }

  - id: decrypt
    label: "🔓 解密"
    icon: "🔓"
    description: "解密文件"
    trigger_keywords:
      - "解密"
      - "decrypt"
      - "unlock"
    on_match:
      id: decrypt_subscenario
      description: "解密子剧本（父选「解密」后跳转）— 拟人化 ≥30s"
      keywords: []
      rounds: 0
      steps:
        # 思考 6 段
        - id: d_think_1
          delay_ms: 700
          events:
            - type: reasoning_delta
              data: { text: "用户选了「解密」。" }
        - id: d_think_2
          delay_ms: 700
          events:
            - type: reasoning_delta
              data: { text: "需要调用解密工具。" }
        - id: d_think_3
          delay_ms: 800
          events:
            - type: reasoning_delta
              data: { text: "参数：encrypted_file + password。" }
        - id: d_think_4
          delay_ms: 800
          events:
            - type: reasoning_delta
              data: { text: "使用对应的 AES-256-GCM 解密算法。" }
        - id: d_think_5
          delay_ms: 800
          events:
            - type: reasoning_delta
              data: { text: "auto_run=false，解密是写操作，必须用户确认。" }
        - id: d_think_6
          delay_ms: 800
          events:
            - type: reasoning_delta
              data: { text: "准备好调用解密工具。" }
        # 过渡 5 段
        - id: d_intro_1
          delay_ms: 400
          events:
            - type: stream_start
              data: { scenario: decrypt_subscenario }
            - type: text_delta
              data: { text: "好的，进入解密流程。" }
        - id: d_intro_2
          delay_ms: 600
          events:
            - type: text_delta
              data: { text: "目标：解密指定文件。" }
        - id: d_intro_3
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "用对应的 AES-256-GCM 解密算法。" }
        - id: d_intro_4
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "需要密码，错误密码会失败。" }
        - id: d_intro_5
          delay_ms: 800
          events:
            - type: text_delta
              data: { text: "开始执行解密..." }
        # 工具调用
        - id: d_tool
          delay_ms: 3000
          events:
            - type: tool_call
              data:
                id: call_dec_1
                name: decrypt_file
                args:
                  ext: ".mp4"
                  password: ""
                auto_run: false
                needsConfirm: true
                kind: fileChange
                execute_real: true
        # 处理 12 段
        - id: d_p_1
          delay_ms: 600
          events:
            - type: text_delta
              data: { text: "解密完成。" }
        - id: d_p_2
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "正在校验输出文件..." }
        - id: d_p_3
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "工具返回了解密结果，详情见上方工具结果。" }
        - id: d_p_4
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "解密文件路径和大小见工具结果。" }
        - id: d_p_5
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "正在校验完整性..." }
        - id: d_p_6
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "正在比对原文件哈希..." }
        - id: d_p_7
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "所有校验通过。" }
        - id: d_p_8
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "正在准备下一步建议..." }
        - id: d_p_9
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "建议操作：" }
        - id: d_p_10
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "1. 删除加密文件" }
        - id: d_p_11
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "2. 解密更多文件" }
        - id: d_p_12
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "3. 重新加密" }
        # 总结 5 段
        - id: d_s_1
          delay_ms: 500
          events:
            - type: text_delta
              data: { text: "## 解密完成\n\n" }
        - id: d_s_2
          delay_ms: 600
          events:
            - type: text_delta
              data: { text: "已解密指定文件，详情见上方工具结果。\n\n" }
        - id: d_s_3
          delay_ms: 600
          events:
            - type: text_delta
              data: { text: "**注意**：解密后的明文文件已写到磁盘，请确认是否需要清理。\n\n" }
        - id: d_s_4
          delay_ms: 700
          events:
            - type: text_delta
              data: { text: "选择你想做的，剩下交给我。" }
        - id: d_end
          delay_ms: 200
          events:
            - type: stream_end
              data: { finishReason: stop, usage: { totalTokens: 920 } }

  - id: cancel
    label: "❌ 取消"
    icon: "❌"
    description: "取消操作"
    trigger_keywords:
      - "取消"
      - "cancel"
      - "exit"
    on_match:
      id: cancel_subscenario
      description: "取消子剧本（父选「取消」后跳转）"
      keywords: []
      rounds: 0
      steps:
        - id: c_think_1
          delay_ms: 500
          events:
            - type: reasoning_delta
              data: { text: "用户选了「取消」。" }
        - id: c_think_2
          delay_ms: 500
          events:
            - type: reasoning_delta
              data: { text: "立即结束，不执行任何操作。" }
        - id: c_intro
          delay_ms: 400
          events:
            - type: stream_start
              data: { scenario: cancel_subscenario }
            - type: text_delta
              data: { text: "好的，已取消。" }
        - id: c_intro_2
          delay_ms: 500
          events:
            - type: text_delta
              data: { text: "没有执行任何操作。" }
        - id: c_intro_3
          delay_ms: 500
          events:
            - type: text_delta
              data: { text: "可以随时重新开始。" }
        - id: c_end
          delay_ms: 200
          events:
            - type: stream_end
              data: { finishReason: stop, usage: { totalTokens: 80 } }

presets:
  - id: do_encrypt
    label: "🔒 加密"
    user_text: "加密"
  - id: do_decrypt
    label: "🔓 解密"
    user_text: "解密"
  - id: do_cancel
    label: "❌ 取消"
    user_text: "取消"

steps:
  # ════════════════════════════════════════════════════════
  # 父剧本：思考 + 选分支 + 总结（≥ 30s）
  # ════════════════════════════════════════════════════════
  - id: parent_think_1
    round_idx: 0
    delay_ms: 700
    events:
      - type: reasoning_delta
        data: { text: "用户要求：对文件做加密或解密操作。" }
  - id: parent_think_2
    round_idx: 0
    delay_ms: 700
    events:
      - type: reasoning_delta
        data: { text: "这是分支选择场景：让用户选「加密」或「解密」。" }
  - id: parent_think_3
    round_idx: 0
    delay_ms: 800
    events:
      - type: reasoning_delta
        data: { text: "选完后跳到对应的 onMatch 子剧本。" }
  - id: parent_think_4
    round_idx: 0
    delay_ms: 800
    events:
      - type: reasoning_delta
        data: { text: "加密和解密都是写操作，必须用户确认。" }
  - id: parent_think_5
    round_idx: 0
    delay_ms: 800
    events:
      - type: reasoning_delta
        data: { text: "auto_run=false，等用户输入。" }
  - id: parent_think_6
    round_idx: 0
    delay_ms: 800
    events:
      - type: reasoning_delta
        data: { text: "准备好推分支选项。" }
  # 过渡 5 段
  - id: parent_intro_1
    round_idx: 0
    delay_ms: 400
    events:
      - type: stream_start
        data: { scenario: branch_encrypt_or_decrypt }
      - type: text_delta
        data: { text: "好的，你需要加密还是解密？" }
  - id: parent_intro_2
    round_idx: 0
    delay_ms: 600
    events:
      - type: text_delta
        data: { text: "两个操作都是写操作（修改文件）。" }
  - id: parent_intro_3
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "选完后会进入详细流程（每步都需要确认）。" }
  - id: parent_intro_4
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "点 chip 直接选。" }
  - id: parent_intro_5
    round_idx: 0
    delay_ms: 800
    events:
      - type: text_delta
        data: { text: "下面推选项..." }
  # chip + branch
  - id: parent_chip
    round_idx: 0
    delay_ms: 400
    branch_choice: true
    events:
      - type: mock_presets
        data:
          scenario: branch_encrypt_or_decrypt
          phase: select_op
          presets:
            - id: do_encrypt
              label: "🔒 加密"
              user_text: "加密"
            - id: do_decrypt
              label: "🔓 解密"
              user_text: "解密"
            - id: do_cancel
              label: "❌ 取消"
              user_text: "取消"
  # 总结
  - id: parent_summary_1
    round_idx: 0
    delay_ms: 600
    events:
      - type: text_delta
        data: { text: "## 选择操作\n\n" }
  - id: parent_summary_2
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "点 chip 选择你想做的操作。\n\n" }
  - id: parent_summary_3
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "1. **加密** — 用密码加密文件\n" }
  - id: parent_summary_4
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "2. **解密** — 用密码解密文件\n" }
  - id: parent_summary_5
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "3. **取消** — 退出本流程\n" }
  - id: parent_summary_6
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "选完后会自动进入详细流程。" }
  - id: parent_summary_7
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "选择你想做的，剩下交给我。" }
  - id: parent_summary_8
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "如果都不想做，可以直接关闭本对话。" }
  - id: parent_summary_9
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "**加密**会修改文件（写入加密内容），请确保密码安全。" }
  - id: parent_summary_10
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "**解密**会修改文件（写入明文内容），请确保有备份。" }
  - id: parent_summary_11
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "**取消**不会修改任何文件，直接退出。" }
  - id: parent_summary_12
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "每个操作都需要你再次确认才会执行。" }
  - id: parent_summary_13
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "选完后我会进入详细流程并提示你。" }
  - id: parent_summary_14
    round_idx: 0
    delay_ms: 700
    events:
      - type: text_delta
        data: { text: "如果暂时无法决定，可以稍后再选。" }
  - id: parent_summary_15
    round_idx: 0
    delay_ms: 800
    events:
      - type: text_delta
        data: { text: "选完后我会自动进入对应流程，每个流程都是独立的子剧本。" }
  - id: parent_summary_16
    round_idx: 0
    delay_ms: 800
    events:
      - type: text_delta
        data: { text: "子剧本会展示更多细节（参数选择 / 工具调用 / 进度提示）。" }
  - id: parent_summary_17
    round_idx: 0
    delay_ms: 800
    events:
      - type: text_delta
        data: { text: "如果你想看分支流程的完整 demo，告诉我即可。" }
  - id: parent_summary_18
    round_idx: 0
    delay_ms: 800
    events:
      - type: text_delta
        data: { text: "如果都不想做，可以直接关闭本对话。" }
  - id: parent_summary_19
    round_idx: 0
    delay_ms: 800
    events:
      - type: text_delta
        data: { text: "加密/解密操作的工具说明见 ENCV 官方文档。" }
  - id: parent_summary_20
    round_idx: 0
    delay_ms: 800
    events:
      - type: text_delta
        data: { text: "如有疑问，可以随时打断当前流程并重新提问。" }
  - id: parent_summary_21
    round_idx: 0
    delay_ms: 800
    events:
      - type: text_delta
        data: { text: "选完后我会立即开始执行你指定的操作。" }
  - id: parent_end
    round_idx: 0
    delay_ms: 200
    events:
      - type: stream_end
        data:
          finishReason: stop
          usage: { totalTokens: 720 }
