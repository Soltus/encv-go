name: Build MPV Native Libraries

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (defaults to current)'
        required: false
        default: ''
        type: string

env:
  NDK_VERSION: "26.1.10909125"
  MPV_LIB_VERSION: "0.1.12"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          submodules: false  # 防御：仓库无真实 submodule

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}

      - name: Install Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: yes | sdkmanager --install "ndk;${{ env.NDK_VERSION }}" > /dev/null 2>&1 && echo "✅ NDK installed"

      - name: Download & Extract MPV AAR
        run: |
          set -euo pipefail
          SCRIPT_DIR="app/encv-mobile/scripts"
          PROJECT_DIR="app/encv-mobile"
          JNI_DIR="$PROJECT_DIR/plugin-mpv-player/src/main/jniLibs"

          AAR_URL="https://repo1.maven.org/maven2/io/github/abdallahmehiz/mpv-android-lib/${{ env.MPV_LIB_VERSION }}/mpv-android-lib-${{ env.MPV_LIB_VERSION }}.aar"
          AAR_TMP="$(mktemp -d)/mpv-android-lib.aar"

          echo "Downloading mpv-android-lib ${{ env.MPV_LIB_VERSION }} AAR..."
          curl -fSL --retry 3 --retry-delay 5 \
            -A "Mozilla/5.0 (compatible; encv-ci/1.0)" \
            -o "$AAR_TMP" "$AAR_URL"

          echo "Extracting prebuilt native libraries (mpv + ffmpeg)..."
          mkdir -p "$JNI_DIR"
          for abi in arm64-v8a; do
            echo "  extracting $abi..."
            mkdir -p "$JNI_DIR/$abi"
            unzip -o -j "$AAR_TMP" "jni/$abi/*.so" -d "$JNI_DIR/$abi" 2>/dev/null || true
            if [ ! -f "$JNI_DIR/$abi/libmpv.so" ]; then
              echo "::error::$abi: libmpv.so not found in AAR!"
              exit 1
            fi
            rm -f "$JNI_DIR/$abi/libplayer.so"
            count=$(find "$JNI_DIR/$abi" -name "*.so" | wc -l)
            echo "  ✓ $abi: ${count} .so files extracted (libplayer.so excluded)"
          done
          rm -f "$AAR_TMP"

          echo ""
          echo "MPV libs ready:"
          ls -lhR "$JNI_DIR/"

      - name: Build libplayer.so via ndk-build
        run: |
          cd app/encv-mobile
          bash scripts/build-player-so.sh

      - name: Package jniLibs as zip
        run: |
          cd app/encv-mobile/plugin-mpv-player/src/main/jniLibs
          ZIP_NAME="mpv-jniLibs-arm64-v8a-v${{ env.MPV_LIB_VERSION }}.zip"
          zip -r "${{ runner.temp }}/$ZIP_NAME" .
          echo "Package created:"
          ls -lh "${{ runner.temp }}/$ZIP_NAME"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mpv-native-libs
          name: "MPV Native Libraries (auto-generated)"
          body: |
            Auto-generated MPV native libraries for Android arm64-v8a.
            **Do not manually edit this release.**
            Generated by `build-mpv-lib` workflow from commit `${{ github.sha }}`.
          overwrite_files: true
          files: ${{ runner.temp }}/mpv-jniLibs-arm64-v8a-v${{ env.MPV_LIB_VERSION }}.zip
