name: E2E Integration (Layer 3)

# =====================================================
# Layer 3 标签触发 — 加密 roundtrip E2E（最慢最重）
#
# 触发（任一）：
#   1. PR 上加 ci:e2e 标签（maintainer 决策，重大变更）
#   2. Actions UI 手动 Run workflow
#   3. push to main（merge 后最终验证）
#   4. schedule 每日 04:00 巡检（cron: '0 4 * * *'）
#
# 跑什么：
#   - ENCV_TEST_FULL=1 bash scripts/test-go.sh ./internal/v2/plugins/video/ -run TestEncryptionE2E
#   - config.user.json JSON 校验
#
# 与 Layer1/2 关系：
#   - Layer1 (pr-check.yml) 必跑，required check
#   - Layer2 (full-regression.yml) maintainer 决策，不 required
#   - Layer3 (本 workflow) maintainer 决策 + 定时巡检，不 required
#
# 安全红线：
#   - 同 full-regression.yml: pull_request 事件 + ci:e2e 标签守卫
# =====================================================

on:
  pull_request:
    types: [opened, synchronize, labeled, reopened, edited]
    branches: [main, dev]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch / ref to test (default: main)'
        required: false
        default: 'main'
        type: string
  schedule:
    - cron: '0 4 * * *'  # 每日 04:00 巡检（北京时间 12:00）

concurrency:
  group: e2e-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NDK_VERSION: "26.1.10909125"

jobs:
  # ── 标签守卫（强制 ci:e2e 存在才放行） ──
  detect-and-guard:
    name: Detect ci:e2e label
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      resolved-ref: ${{ steps.check.outputs.resolved-ref }}
      trigger-source: ${{ steps.check.outputs.trigger-source }}
    steps:
      - name: Determine if Layer 3 should run
        id: check
        run: |
          set -e
          # workflow_dispatch / push / schedule 永远跑
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            case "${{ github.event_name }}" in
              workflow_dispatch)
                REF="${{ inputs.branch || 'main' }}"
                echo "should-run=true (workflow_dispatch, ref=$REF)" >> "$GITHUB_OUTPUT"
                echo "resolved-ref=$REF" >> "$GITHUB_OUTPUT"
                echo "trigger-source=workflow_dispatch" >> "$GITHUB_OUTPUT"
                ;;
              push)
                echo "should-run=true (push to ${{ github.ref_name }})" >> "$GITHUB_OUTPUT"
                echo "resolved-ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
                echo "trigger-source=push" >> "$GITHUB_OUTPUT"
                ;;
              schedule)
                echo "should-run=true (scheduled daily 04:00 UTC)" >> "$GITHUB_OUTPUT"
                echo "resolved-ref=main" >> "$GITHUB_OUTPUT"
                echo "trigger-source=schedule" >> "$GITHUB_OUTPUT"
                ;;
            esac
            exit 0
          fi
          # pull_request: 必须有 ci:e2e 标签
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          echo "PR #${{ github.event.pull_request.number }} labels: $LABELS"
          if echo "$LABELS" | grep -q "ci:e2e"; then
            REF="${{ github.event.pull_request.head.sha }}"
            echo "should-run=true (ci:e2e label present, ref=$REF)" >> "$GITHUB_OUTPUT"
            echo "resolved-ref=$REF" >> "$GITHUB_OUTPUT"
            echo "trigger-source=label" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should-run=false (no ci:e2e label; skipped to save CI minutes)" >> "$GITHUB_OUTPUT"
          echo "trigger-source=skipped" >> "$GITHUB_OUTPUT"

  # ── 加密 roundtrip E2E ──
  encryption-e2e:
    name: Encryption E2E roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: detect-and-guard
    if: needs.detect-and-guard.outputs.should-run == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-and-guard.outputs.resolved-ref }}
          fetch-depth: 1
          submodules: false  # 防御

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
          cache-dependency-path: go.sum

      - name: Run encryption E2E roundtrip
        run: |
          echo "═══ Encryption E2E Roundtrip (Layer 3) ═══"
          # ENCV_TEST_FULL=1 解除 -short 跑全部 E2E case
          ENCV_TEST_FULL=1 bash scripts/test-go.sh \
            ./internal/v2/plugins/video/ \
            -run TestEncryptionE2E \
            2>&1 | tee e2e-output.txt
          rc=${PIPESTATUS[0]}
          echo ""
          echo "exit_code=$rc"
          echo "  0=OK / 1=FAIL / 64=GUARD_REJECTED / 124=TIMEOUT / 137=OOM"
          exit $rc

      - name: Config consistency check
        run: |
          echo "═══ Config Consistency Check ═══"
          if [ -f "config.user.json" ]; then
            echo "✅ config.user.json exists"
            if cat config.user.json | jq '.' > /dev/null 2>&1; then
              echo "✅ JSON valid"
            else
              echo "::error::❌ config.user.json JSON invalid"
              exit 1
            fi
          else
            echo "⚠️ config.user.json not found (using fallback)"
          fi

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer3-e2e-logs
          path: e2e-output.txt
          retention-days: 7
          if-no-files-found: ignore

  # ── Layer 3 summary ──
  layer3-summary:
    name: Layer 3 Summary
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [detect-and-guard, encryption-e2e]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Layer 3 (E2E Integration) Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ci:e2e guard | ${{ needs.detect-and-guard.outputs.should-run }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger source | ${{ needs.detect-and-guard.outputs.trigger-source }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Encryption E2E | ${{ needs.encryption-e2e.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 触发方式" >> $GITHUB_STEP_SUMMARY
          echo "- Event: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "- PR: #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
            echo "- Label: \`ci:e2e\`" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "- Scheduled: 每日 04:00 UTC（北京时间 12:00）巡检" >> $GITHUB_STEP_SUMMARY
          fi
