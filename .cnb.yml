# ENCV 远程开发环境自动准备流水线
#
# 通过 $.vscode 事件，每次启动「云原生开发」时自动完成环境准备：
#   - 使用 .ide/Dockerfile 构建自定义镜像（Go 1.25.1 + pnpm 11 + Python3 + cmake + JDK + xvfb）
#   - 运行 scripts/setup-sandbox-env.sh：装工具链 / clone fork / pnpm workspace 安装 / 构建网关
$:
  vscode:
    - runner:
        cpus: 6
      docker:
        # 自定义开发环境
        build:
          # 指定构建镜像的 Dockerfile 文件
          dockerfile: .ide/Dockerfile
          # 声明构建过程依赖的文件列表（用于缓存判定）。
          # 注意：如构建过程用到其他文件，也需在此声明。
          # 参考文档：https://docs.cnb.cool/zh/grammar/pipeline.html#build
          by:
            - .ide/settings.json
      services:
        # docker 写在 vscode 前面
        - docker
        - name: vscode
          options:
            # 保活时间，单位毫秒，不设置默认 10 分钟没有心跳（检测不到开发环境内的 http/ssh 连接）就关闭开发环境
            keepAliveTimeout: 30m
      env:
        # 关键：默认 NODE_ENV=production 会让 pnpm install 跳过 devDependencies，
        # 导致 typescript / vue-tsc / vite / vitest / cypress 等开发工具全部缺失。
        NODE_ENV: development
        GOPROXY: https://goproxy.cn,direct
      stages:
        - name: 准备沙箱开发环境
          # 一键准备：Go/Kotlin 工具链、OpenList/ComboLite/Maker/Phaser fork、
          # pnpm workspace 依赖、preview-gateway 网关（详见脚本头注释）。
          script: |
            export NODE_ENV=development
            bash scripts/setup-sandbox-env.sh

        - name: 注册工作区 MCP（app-dev / web-fetch）
          # 只注册本仓库自有的两个 MCP（dev 门禁 / shell / skill 管理、网页抓取）。
          # 采用「读取现有配置 → merge 本仓库条目 → 原子写回」的方式：
          # /root/.codebuddy/mcp.json 里还有**环境镜像**预置的其它 server 注册，
          # 整文件覆盖会把它们抹掉，所以这里只能合并写、不能覆盖。
          script: |
            export NODE_ENV=development
            set -uo pipefail
            REPO_ROOT="$(pwd)"
            CFG_SRC="${REPO_ROOT}/.codebuddy/mcp.json"
            CFG_DST="/root/.codebuddy/mcp.json"
            if [ ! -f "${CFG_SRC}" ]; then
              echo "⚠️ 找不到 ${CFG_SRC}，跳过 MCP 注册"
              exit 0
            fi
            mkdir -p /root/.codebuddy
            node -e '
              const fs = require("fs");
              const src = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const dst = process.argv[2];
              let cur = { mcpServers: {} };
              try { cur = JSON.parse(fs.readFileSync(dst, "utf8")); } catch { /* 不存在/损坏：从空开始 */ }
              if (!cur.mcpServers || typeof cur.mcpServers !== "object") cur.mcpServers = {};
              for (const [k, v] of Object.entries(src.mcpServers || {})) cur.mcpServers[k] = v;
              const tmp = `${dst}.${process.pid}.tmp`;
              fs.writeFileSync(tmp, JSON.stringify(cur, null, 2));
              fs.renameSync(tmp, dst);
              console.log(`✅ MCP 已合并注册 -> ${dst}（共 ${Object.keys(cur.mcpServers).length} 个 server）`);
            ' "${CFG_SRC}" "${CFG_DST}"

include:
  - https://cnb.cool/sc.hwd/cnb-sync/-/blob/main/.cnb/workflows/sync.yml
